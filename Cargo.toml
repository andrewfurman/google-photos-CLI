[package]
name = "google-photos-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Unofficial Google Photos CLI with local Chrome session import"
repository = "https://github.com/andrewfurman/google-photos-CLI"
readme = "README.md"

[[bin]]
name = "gphotos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
reqwest_cookie_store = "0.9"
cookie_store = { version = "0.22", features = ["serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
tempfile = "3"
url = "2"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[dev-dependencies]
assert_cmd = "2"
